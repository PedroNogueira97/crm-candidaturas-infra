# Site do CRM no Nginx do host (VPS compartilhada).
# Instalar em /etc/nginx/sites-available/crm-candidatura.conf, habilitar com symlink em
# sites-enabled e emitir o certificado com: certbot --nginx -d crm-candidatura.lnmengenharia.com
# O certbot acrescenta o bloco 443 e o redirecionamento HTTP -> HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name crm-candidatura.lnmengenharia.com;

    # Upload de planilhas de importação (Entrega 2).
    client_max_body_size 10m;

    # IP real dos clientes vindos da Cloudflare (Entrega 3.4). Copiar nginx/cloudflare-real-ip.conf
    # para /etc/nginx/snippets/; atualizar com scripts/update-cloudflare-ips.sh.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Com o real_ip, $remote_addr já é o cliente. Valor único: a cadeia enviada pelo
        # cliente é descartada.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Correlação de logs com o Caddy e a API (docs/observabilidade.md).
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
