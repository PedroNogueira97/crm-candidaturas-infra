# Site do CRM no Nginx do host (VPS compartilhada).
# Instalar em /etc/nginx/sites-available/crm-candidatura.conf, habilitar com symlink em
# sites-enabled e emitir o certificado com: certbot --nginx -d crm-candidatura.lnmengenharia.com
# O certbot acrescenta o bloco 443 e o redirecionamento HTTP -> HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name crm-candidatura.lnmengenharia.com;

    # Upload de planilhas de importação (Entrega 2).
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
