# Site do STAGING no Nginx do host (VPS compartilhada). Mesmo desenho da produção
# (nginx/crm-candidatura.conf), apontando para o stack de staging em 127.0.0.1:8082.
# Instalar em /etc/nginx/sites-available/staging-crm.conf, habilitar com symlink em
# sites-enabled e emitir o certificado com: certbot --nginx -d staging-crm.lnmengenharia.com
# O certbot acrescenta o bloco 443 e o redirecionamento HTTP -> HTTPS.
#
# O acesso é restrito pelo Cloudflare Access (docs/staging.md). Ficam fora do Access só o
# webhook do Stripe (que confere a própria assinatura) e o desafio do certbot.

server {
    listen 80;
    listen [::]:80;
    server_name staging-crm.lnmengenharia.com;

    client_max_body_size 10m;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # Ambiente de teste: fora dos buscadores.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Caixa de entrada do Mailpit (e-mails do staging não saem para a internet).
    location /mailpit/ {
        proxy_pass http://127.0.0.1:8026;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # A interface atualiza a lista por WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
