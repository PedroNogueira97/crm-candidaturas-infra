name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar compose de produção
        run: |
          cp .env.production.example .env
          BACKEND_TAG=ci FRONTEND_TAG=ci docker compose -f compose.prod.yaml --env-file .env config -q

      - name: Validar compose de staging (projeto e volume separados da produção)
        run: |
          config=$(BACKEND_TAG=ci FRONTEND_TAG=ci docker compose -f compose.prod.yaml \
            --env-file .env.staging.example config --format json)
          jq -e '.name == "crm-candidaturas-staging"
            and (.volumes["postgres-data"].name == "crm-candidaturas-staging_postgres-data")
            and (.services.proxy.ports[0].published == "8082")
            and (.services | has("mailpit"))' <<<"$config" >/dev/null
          prod=$(BACKEND_TAG=ci FRONTEND_TAG=ci docker compose -f compose.prod.yaml \
            --env-file .env.production.example config --format json)
          jq -e '.name == "crm-candidaturas"
            and (.volumes["postgres-data"].name == "crm-candidaturas_postgres-data")
            and (.services | has("mailpit") | not)' <<<"$prod" >/dev/null

      - name: Validar compose local
        run: |
          cp .env.example .env.local-ci
          docker compose --env-file .env.local-ci --profile stripe config -q

      - name: Validar Caddyfile
        run: |
          docker run --rm -e SITE_ADDRESS=example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: ShellCheck
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh scripts/tests/*.sh

      - name: Testes dos scripts
        run: scripts/tests/dotenv_test.sh
