name: Deploy produção

# Disparado pelos repositórios backend/frontend após publicar a imagem
# (repository_dispatch "deploy" com client_payload {service, tag}),
# ou manualmente, escolhendo as tags (deploy, rollback ou reaplicar configuração).
on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      backend_tag:
        description: "Tag da imagem do backend (vazio = manter a atual)"
        required: false
      frontend_tag:
        description: "Tag da imagem do frontend (vazio = manter a atual)"
        required: false

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/crm-candidaturas' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolver tags
        id: tags
        env:
          EVENT: ${{ github.event_name }}
          SERVICE: ${{ github.event.client_payload.service }}
          TAG: ${{ github.event.client_payload.tag }}
          IN_BACKEND: ${{ inputs.backend_tag }}
          IN_FRONTEND: ${{ inputs.frontend_tag }}
        run: |
          backend=""; frontend=""
          if [[ "$EVENT" == "repository_dispatch" ]]; then
            case "$SERVICE" in
              backend) backend="$TAG" ;;
              frontend) frontend="$TAG" ;;
              *) echo "serviço inválido: $SERVICE"; exit 1 ;;
            esac
          else
            backend="$IN_BACKEND"; frontend="$IN_FRONTEND"
          fi
          for t in "$backend" "$frontend"; do
            [[ -z "$t" || "$t" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "tag inválida: $t"; exit 1; }
          done
          args=""
          [[ -n "$backend" ]] && args+=" --backend $backend"
          [[ -n "$frontend" ]] && args+=" --frontend $frontend"
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "Deploy:${args:- reaplicar tags atuais}" >> "$GITHUB_STEP_SUMMARY"

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            Port ${{ secrets.VPS_PORT || '22' }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Enviar compose, Caddyfile e scripts
        run: |
          ssh vps "mkdir -p '$APP_DIR'"
          rsync -az --chmod=D750,F640 compose.prod.yaml Caddyfile vps:"$APP_DIR/"
          rsync -az --chmod=D750,F750 scripts/ vps:"$APP_DIR/scripts/"

      - name: Login no GHCR na VPS
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '$GHCR_USER' --password-stdin" >/dev/null

      - name: Deploy
        run: ssh vps "cd '$APP_DIR' && scripts/deploy.sh${{ steps.tags.outputs.args }}"

      - name: Verificar endpoint público
        env:
          SITE: ${{ vars.SITE_ADDRESS || 'crm-candidatura.lnmengenharia.com' }}
          CHECK_PUBLIC: ${{ vars.CHECK_PUBLIC_URL || 'false' }}
        if: env.CHECK_PUBLIC == 'true'
        run: |
          for i in $(seq 1 10); do
            curl -fsS "https://$SITE/api/health" && exit 0
            sleep 6
          done
          echo "endpoint público não respondeu"; exit 1

      - name: Limpar chave
        if: always()
        run: rm -f ~/.ssh/id_deploy
